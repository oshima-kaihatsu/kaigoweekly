# 毎週のニュース更新（2026-11-16、PC のタスク スケジューラから移した）
# 毎週月曜 5:30（日本時間）に、前の週のニュースを集めて記事にし、kaigoweekly.jp へ公開する。
# 週のまとめのメールは、Cloudflare の worker が月曜 8:30 に公開済みの dist/mail/weekly-latest.json を読んで送る。
# 鍵（Secrets）：
#   CLAUDE_CODE_OAUTH_TOKEN … 記事づくりの手順だけに渡す（Cloudflare の鍵は渡さない）
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID … 公開の手順だけに渡す
name: 毎週のニュース更新

on:
  schedule:
    - cron: '30 20 * * 0'   # UTC 日曜 20:30 ＝ 日本時間 月曜 5:30（GitHub の開始の遅れと実行時間を見込み、8:30 の配信の3時間前）
  workflow_dispatch:
    inputs:
      week:
        description: '対象の週（例 2026-W46）。空なら前の週'
        required: false
        default: ''
      publish:
        description: '公開する（kaigoweekly.jp へ上げる）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 140   # 5:30 開始でも 7:50 までに必ず終わる（8:30 の配信に間に合わせる）
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # AI の手順から GitHub の鍵が見えないように、最後の保存の手順でだけ使う

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 準備（wrangler と Claude Code）
        run: |
          npm ci
          npm install -g @anthropic-ai/claude-code@2.1.325

      - name: 記事づくり（集める→下書き→照合→組み立て。公開はしない）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WEEK: ${{ github.event.inputs.week }}
          TZ: Asia/Tokyo
        run: |
          if [ -n "$WEEK" ] && ! echo "$WEEK" | grep -Eq '^[0-9]{4}-W[0-9]{2}$'; then echo "週の形が正しくありません：$WEEK"; exit 1; fi
          node tools/news/run-week.mjs $WEEK --no-publish

      - name: 公開（点検に合格したら kaigoweekly.jp へ上げる。記事が0本の週も、審議中の案件リストのメールを届けるため上げる）
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAIL_WEEK: ${{ github.event.inputs.week }}
          TZ: Asia/Tokyo
        run: |
          node tools/make-dist.mjs
          node -e "const m=require('./dist/mail/weekly-latest.json');console.log('配信の準備：',m.week,m.kind,m.subject)"
          npx wrangler deploy

      - name: 記事と照合の記録をリポジトリに残す（成功したときだけ。失敗した実行の途中の状態は残さない）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ github.event.inputs.week }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "kaigoweekly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles index.html tools/news/generated.json tools/news/確認一覧.md tools/news/checks
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          case "$WEEK" in ''|[0-9][0-9][0-9][0-9]-W[0-9][0-9]) ;; *) WEEK='';; esac
          git commit -m "毎週のニュース更新 ${WEEK:-（前の週）}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"

      - name: 実行の記録（ログ）を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: tools/news/logs/
          retention-days: 90
          if-no-files-found: ignore
